<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RayChat · Status</title><style>:root{color-scheme:dark}body{margin:0;background:#0d111b;color:#eaf0fb;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(100%,510px);background:#171e2b;border:1px solid #293448;border-radius:22px;padding:32px;text-align:center}.logo{font-weight:900;font-size:29px;color:#9caaff}h1{font-size:24px}p{color:#a3b0c7}button,a.btn{display:inline-block;border:0;border-radius:11px;background:#6f83ff;color:white;padding:12px 22px;font-weight:750;cursor:pointer;text-decoration:none}[hidden]{display:none!important}button:disabled{opacity:.5}small{display:block;margin-top:25px;color:#8f9db3}</style></head><body><main class="box"><div class="logo">◉ RayChat</div><h1 id="title">Estamos fora do ar no momento</h1><p id="description">Seja notificado assim que voltarmos.</p><button id="notify">Quero ser notificado quando voltar</button><p><a id="open" class="btn" hidden>Entrar no RayChat ↗</a></p><small>Verificamos o retorno a cada 60 segundos. Para receber o aviso, mantenha esta página aberta. Não enviamos alertas com o navegador fechado.</small></main><script src="/config.js"></script><script>const url=window.RAYCHAT_TUNNEL_URL||'', valid=/^https:\/\/[^/]+/.test(url)&&!url.includes('SEU-TUNNEL'),title=document.querySelector('#title'),desc=document.querySelector('#description'),open=document.querySelector('#open'),notify=document.querySelector('#notify');let wasOffline=true;async function check(){if(!valid){title.textContent='Estamos fora do ar no momento';desc.textContent='Seja notificado assim que voltarmos. Estamos preparando o retorno.';return}try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8000);let r=await fetch(url.replace(/\/$/,'')+'/api/status',{cache:'no-store',signal:controller.signal});clearTimeout(timeout);if(!r.ok)throw Error('Indisponível');const j=await r.json();if(!j.online)throw Error('Manutenção');title.textContent='RayChat está online!';desc.textContent='O servidor está pronto para receber você.';open.href=url;open.hidden=false;if(wasOffline&&'Notification' in window&&Notification.permission==='granted')new Notification('RayChat voltou!',{body:'O servidor está online novamente.'});wasOffline=false;setTimeout(()=>location.replace(url),1800)}catch(e){wasOffline=true;title.textContent='Estamos fora do ar no momento';desc.textContent='Seja notificado assim que voltarmos. Seus dados continuam preservados.';open.hidden=true}}notify.onclick=async()=>{if(!('Notification'in window)){desc.textContent='Notificações não são compatíveis com este navegador.';return}const permission=await Notification.requestPermission();notify.textContent=permission==='granted'?'Avisos ativados (mantenha esta página aberta)':'Notificações não permitidas'};check();setInterval(check,60000);</script></body></html>
